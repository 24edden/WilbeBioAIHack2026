[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "team-tbd-investigation"
version = "0.1.0"
description = "Team TBD: observable scientific agents, data analysis, review and BioNeMo"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0", "httpx==0.28.1", "pydantic==2.13.5", "python-dotenv==1.2.3", "openai-agents==0.22.3", "openai==3.16.2", "biopython==1.88", "h5py==3.16.0", "numpy==2.5.3", "scipy==1.18.1", "scikit-learn==1.9.1", "requests==2.34.2"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
