[project]
name = "patient-failure-agents"
version = "0.1.0"
description = "Multi-agent patient failure-investigation backend (Wilbe Bio x AI Hack 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.providers", "app.agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
