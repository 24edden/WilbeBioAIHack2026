<section class="run-clock" data-theme="dark" aria-label="Local submission timing">
  <div id="clock-label" class="run-clock-label">Time since local submission</div>
  <div id="clock-value" class="run-clock-value" role="timer" aria-live="off" aria-labelledby="clock-label">00:00:00</div>
  <div id="clock-measured" class="run-clock-measured"></div>
  <div id="clock-note" class="run-clock-note">Elapsed time does not indicate provider progress or health.</div>
</section>
