<div id="voice-preferences">
  <p>Your browser may send microphone audio to its speech provider. TRACE receives the draft text only. Review it before starting.</p>
  <label><input id="voice-consent" type="checkbox"> Enable microphone input</label>
  <label><input id="voice-spoken" type="checkbox"> Speak brief workflow updates</label>
  <label for="voice-choice">Narrator voice</label><select id="voice-choice"></select>
  <label><input id="voice-online" type="checkbox"> Include online voices</label>
  <p>Online voices may send fixed workflow cues to their provider. Questions and findings are never read aloud.</p>
  <div><button id="voice-preview" type="button">Preview voice</button><button id="voice-silence" type="button">Silence</button></div>
  <p id="voice-status" role="status" aria-live="polite">Voice is optional. Typing always works.</p>
</div>
